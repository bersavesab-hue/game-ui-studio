name: Bootstrap Source and Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-build.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v0.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.part00 bootstrap/source.part01 bootstrap/source.part02 bootstrap/source.part03 bootstrap/source.part04 bootstrap/source.part05 bootstrap/source.part06 > "$RUNNER_TEMP/source.b64"
          base64 --decode "$RUNNER_TEMP/source.b64" > "$RUNNER_TEMP/source.zip"
          unzip -t "$RUNNER_TEMP/source.zip"
          mkdir -p "$RUNNER_TEMP/unpack"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/unpack"
          SRC="$RUNNER_TEMP/unpack/game-ui-studio"
          test -f "$SRC/app/build.gradle.kts"
          cp -a "$SRC"/. ./
          # Keep the currently executing bootstrap workflow; do not push from CI.
          rm -rf bootstrap

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-ui-studio-v0.4.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
