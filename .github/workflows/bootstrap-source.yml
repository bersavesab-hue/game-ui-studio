name: Bootstrap source and build APK

on:
  push:
    branches: [ main ]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v0.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          test -d bootstrap
          cat bootstrap/source.part* | tr -d '\r\n' > "$RUNNER_TEMP/source.b64"
          base64 --decode "$RUNNER_TEMP/source.b64" > "$RUNNER_TEMP/source.zip"
          mkdir -p "$RUNNER_TEMP/unpack"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/unpack"
          SRC="$RUNNER_TEMP/unpack/game-ui-studio"
          test -f "$SRC/settings.gradle.kts"
          cp -a "$SRC"/. ./
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: restore v0.4.0 source"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-ui-studio-v0.4.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
